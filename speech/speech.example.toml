# The speech node's settings: copy to speech.toml in the install directory (the folder above
# bin/ringback-speech). Paths are relative to this file.

hub = "ws://HUB-ADDRESS:PORT/speech"  # the hub's address with its port, as `listen` in its hub.toml;
                                      # or if it serves HTTPS ([tls]), its URL: "https://NAME:PORT"
# ca = "hub-ca.pem"                   # a CA to trust for the hub's certificate besides the system's,
                                      # for one a CA of your own signed (optional)
# key = "…"                          # the node's own key: `ringback-speech pair HUB CODE` writes
                                      # it here, with hub, from a code the hub's portal makes
token = "SAME AS [tokens] speech IN THE HUB'S CONFIG"  # before pairing, instead of key
name = "speech node"                  # for the hub's log
provider = "cuda"                     # or "cpu"
threads = 2                           # CPU threads for Parakeet and Kokoro
idle = 60                             # seconds with no call before the models are let go
voice = "qwen3"                       # Qwen3-TTS, a whole reply in one take; or "kokoro", a
                                      # sentence at a time

[models]
silero = "models/silero-vad-v5.onnx"
smart_turn = "models/smart-turn-v3.2-cpu.onnx"
parakeet = "models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-fp16"
kokoro = "models/kokoro-multi-lang-v1_0"
espeak = "espeak-ng"                  # lib/libespeak-ng.so.1 and espeak-ng-data/; optional
qwen3 = "models/qwen3-tts-12hz-1.7b-base-q8_0.gguf"
audiocpp = "audiocpp"                 # audio.cpp's server, which runs Qwen3
voice_clip = "voices/hadley.wav"      # the voice Qwen3 speaks in, with its words in hadley.txt

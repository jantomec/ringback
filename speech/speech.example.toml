# The speech node's settings: copy to speech.toml in the install directory (the folder above
# bin/ringback-speech). Paths are relative to this file.

hub = "ws://HUB-ADDRESS:PORT/speech"  # the hub's address, as in the app, with /speech
token = "SAME AS [tokens] speech IN THE HUB'S CONFIG"
name = "speech node"                  # for the hub's log
provider = "cuda"                     # or "cpu"
threads = 2                           # CPU threads for Parakeet and Kokoro

[models]
silero = "models/silero-vad-v5.onnx"
smart_turn = "models/smart-turn-v3.2-cpu.onnx"
parakeet = "models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-fp16"
kokoro = "models/kokoro-multi-lang-v1_0"
espeak = "espeak-ng"                  # lib/libespeak-ng.so.1 and espeak-ng-data/; optional

# Generates Ringback.xcodeproj:  cd app && xcodegen generate
# Personal values (team, bundle ID) come from Config/Local.xcconfig; see the .example file.
name: Ringback
options:
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 156.0.0
targets:
  Ringback:
    type: application
    platform: iOS
    sources:
      - Ringback
      - Shared
      # The app's settings, in the Settings app (Settings → Apps → Ringback).
      - path: Settings.bundle
        buildPhase: resources
    dependencies:
      - package: WebRTC
      - target: RingbackControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RINGBACK_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(RINGBACK_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Ringback/Assets.xcassets, from app/Icon (make.sh).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Ringback/Ringback.entitlements
      properties:
        aps-environment: development
        # Shared with the Control Center extension: the hub's address, the token, the hold switch.
        keychain-access-groups: [$(AppIdentifierPrefix)$(RINGBACK_BUNDLE_ID).shared]
    info:
      path: Ringback/Info.plist
      properties:
        CFBundleDisplayName: Ringback
        RingbackKeychainGroup: $(AppIdentifierPrefix)$(RINGBACK_BUNDLE_ID).shared
        UILaunchScreen: {}
        UIBackgroundModes: [voip, audio, remote-notification]
        NSMicrophoneUsageDescription: Ringback uses the microphone so you can talk to your Claude Code sessions.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  # The hold switch in Control Center (Controls/HoldControl.swift), which can also go on the
  # Lock Screen or the Action button.
  RingbackControls:
    type: app-extension
    platform: iOS
    sources:
      - Controls
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RINGBACK_BUNDLE_ID).controls
        DEVELOPMENT_TEAM: $(RINGBACK_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: Controls/RingbackControls.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(RINGBACK_BUNDLE_ID).shared]
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Ringback
        RingbackKeychainGroup: $(AppIdentifierPrefix)$(RINGBACK_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

[project]
name = "ringback-voice"
version = "0.1.0"
description = "The voice side of a ringback call, on the Mac whose session is calling"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[webrtc]==1.14.0",
    "aiohttp>=3.10",
]

[project.scripts]
ringback-voice = "ringback_voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ringback-tools"
version = "0.1.0"
description = "The Python the checks in tools/ run with: the stand-in phone, and Kokoro to speak your side"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.5",
    "aiortc==1.15.0",
    "av==17.1.0",
    "numpy==2.5.4",
    "soxr==1.0.0",
    # Kokoro on Apple silicon, which speaks your reply in tools/line-check.
    "mlx-audio==0.6.2",
    "misaki[en]==0.9.4",
    # Kokoro's text-to-phoneme step needs spaCy's English model, and would otherwise
    # download it on first use.
    "en-core-web-sm==3.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

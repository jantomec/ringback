{{define "content"}}
<div class="auth">
  <form class="card" method="post" action="/portal/code">
    <img class="mark big" src="/portal/static/icon.svg" alt="">
    <h1>Passcode</h1>
    <p class="sub">Enter the 6-digit code your authenticator app shows for ringback hub.</p>
    {{- if .Error}}
    <p class="error" role="alert">{{.Error}}</p>
    {{- end}}
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="code">Code</label>
    <input id="code" name="code" class="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" required autofocus>
    <button type="submit" class="primary">Sign in</button>
    <p class="alt"><a href="/portal/login">Start over</a></p>
  </form>
</div>
{{end}}
